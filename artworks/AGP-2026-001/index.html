<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold Treasures | كنوز الذهب</title>
  
  <!-- استدعاء الخطوط الفاخرة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Montserrat:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
    }

    .luxury-card {
      width: 100%;
      max-width: 380px;
      background-color: #000000;
      border: 1.5px solid #c5a059;
      border-radius: 20px;
      padding: 40px 20px 35px 20px;
      text-align: center;
      box-shadow: 0 0 20px rgba(197, 160, 89, 0.15);
    }

    .main-title-ar {
      font-family: 'Amiri', serif;
      font-size: 38px;
      color: #d4af37;
      font-weight: 700;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .main-title-en {
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      color: #d4af37;
      font-weight: 400;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    /* شارة عرض الرقم التسلسلي للوحة */
    .serial-badge {
      display: inline-block;
      background: rgba(197, 160, 89, 0.1);
      border: 1px solid #c5a059;
      color: #d4af37;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    .sub-text-ar {
      font-size: 15px;
      color: #e5e5e5;
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .sub-text-en {
      font-size: 12px;
      color: #d4d4d4;
      font-family: 'Montserrat', sans-serif;
      margin-bottom: 30px;
      line-height: 1.4;
    }

    /* أزرار التشغيل الذهبية */
    .gold-btn {
      width: 100%;
      background: linear-gradient(180deg, #ebd07b 0%, #c5a059 50%, #9e7a32 100%);
      color: #000000;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 15px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(197, 160, 89, 0.2);
    }

    .gold-btn.en {
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
    }

    .gold-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    /* مشغلات الصوت المخفية */
    audio {
      display: none;
    }
  </style>
</head>
<body>

  <div class="luxury-card">
    <div class="main-title-ar">كنوز الذهب</div>
    <div class="main-title-en">Gold Treasures</div>

    <!-- عرض رقم تسلسل اللوحة -->
    <div class="serial-badge" id="serial-display">---</div>

    <div class="sub-text-ar">اختر اللغة للاستماع إلى الرواية الفلسفية للوحة</div>
    <div class="sub-text-en">Choose the language to listen to the philosophical story of the artwork</div>

    <!-- أزرار الاستماع -->
    <button class="gold-btn" onclick="playAudio('audio-ar')">الاستماع بالعربية</button>
    <button class="gold-btn en" onclick="playAudio('audio-en')">Listen in English</button>

    <!-- عناصر مشغلات الصوت التي سيتم إسناد روابط Hugging Face لها تلقائياً -->
    <audio id="audio-ar" controls preload="metadata"></audio>
    <audio id="audio-en" controls preload="metadata"></audio>
  </div>

  <script>
    // 1. قراءة الرمز التسلسلي للوحة من رابط الصفحة تلقائياً
    const urlParams = new URLSearchParams(window.location.search);
    const serial = urlParams.get('serial') || 'AGP-2026-001';

    // 2. عرض رقم التسلسل في الشارة
    document.getElementById('serial-display').innerText = serial;

    // 3. مسار المجلد الرئيسي على Hugging Face
    const baseUrl = "https://huggingface.co/datasets/alwan-protocol/gold-treasures-audio/resolve/main/audio/";

    // 4. تعيين رابط المقطع العربي والإنجليزي تلقائياً حسب التسلسل
    document.getElementById('audio-ar').src = `${https://huggingface.co/datasets/alwan-protocol/gold-treasures-audio/resolve/main/audio/AGP-2026-001-AR.mp3](https://huggingface.co/datasets/alwan-protocol/gold-treasures-audio/resolve/main/audio/AGP-2026-001-AR.mp3}${AGP-2026-001-AR.mp3}-AR.mp3`;
    document.getElementById('audio-en').src = `${https://huggingface.co/datasets/alwan-protocol/gold-treasures-audio/resolve/main/audio/AGP-2026-001-EN.mp3](https://huggingface.co/datasets/alwan-protocol/gold-treasures-audio/resolve/main/audio/AGP-2026-001-EN.mp3}${AGP-2026-001-EN.mp3}-EN.mp3`;

    // 5. دالة التشغيل التي تضمن إيقاف الصوت الآخر عند بدء الجديد
    function playAudio(id) {
      var ar = document.getElementById('audio-ar');
      var en = document.getElementById('audio-en');
      
      if (id === 'audio-ar') {
        en.pause();
        en.currentTime = 0;
        ar.play();
      } else {
        ar.pause();
        ar.currentTime = 0;
        en.play();
      }
    }
  </script>

</body>
</html>
